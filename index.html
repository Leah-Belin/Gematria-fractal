<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gematria Fractal</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <h1>Gematria Fractal</h1>
  <div class="subtitle">גמטריה — אותיות כמספרים, מספרים כצורות</div>
</header>

<div class="controls">
  <div class="control-group">
    <label>Preset Passage</label>
    <select id="preset">
      <option value="">— select —</option>
      <option value="בְּרֵאשִׁית בָּרָא אֱלֹהִים">בְּרֵאשִׁית בָּרָא אֱלֹהִים — Genesis 1:1</option>
      <option value="אָנֹכִי יְהוָה אֱלֹהֶיךָ">אָנֹכִי יְהוָה אֱלֹהֶיךָ — Exodus 20:2</option>
      <option value="מִי כָמֹכָה בָּאֵלִם יְהוָה">מִי כָמֹכָה בָּאֵלִם יְהוָה — Exodus 15:11</option>
      <option value="וְאָהַבְתָּ לְרֵעֲךָ כָּמוֹךָ">וְאָהַבְתָּ לְרֵעֲךָ כָּמוֹךָ — Leviticus 19:18</option>
      <option value="יְבָרֶכְךָ יְהוָה וְיִשְׁמְרֶךָ">יְבָרֶכְךָ יְהוָה וְיִשְׁמְרֶךָ — Numbers 6:24</option>
      <option value="שְׁמַע יִשְׂרָאֵל יְהוָה אֱלֹהֵינוּ יְהוָה אֶחָד">שְׁמַע יִשְׂרָאֵל יְהוָה אֱלֹהֵינוּ יְהוָה אֶחָד — Deuteronomy 6:4</option>
      <option value="קָדוֹשׁ קָדוֹשׁ קָדוֹשׁ יְהוָה צְבָאוֹת">קָדוֹשׁ קָדוֹשׁ קָדוֹשׁ יְהוָה צְבָאוֹת — Isaiah 6:3</option>
      <option value="לֹא בְחַיִל וְלֹא בְכֹחַ כִּי אִם בְּרוּחִי">לֹא בְחַיִל וְלֹא בְכֹחַ כִּי אִם בְּרוּחִי — Zechariah 4:6</option>
      <option value="יְהוָה רֹעִי לֹא אֶחְסָר">יְהוָה רֹעִי לֹא אֶחְסָר — Psalm 23:1</option>
      <option value="אֱמֶת וֶאֱמוּנָה">אֱמֶת וֶאֱמוּנָה — Truth and Faith</option>
      <option value="אַהֲבַת עוֹלָם">אַהֲבַת עוֹלָם — Eternal Love</option>
      <option value="תּוֹרָה אוֹר">תּוֹרָה אוֹר — Torah is Light (Proverbs 6:23)</option>
    </select>
  </div>

  <div class="control-group">
    <label>Or Enter Hebrew</label>
    <input type="text" id="hebrew-input" placeholder="הכנס טקסט עברי" />
  </div>

  <div class="control-group">
    <label>Max Iterations</label>
    <input type="range" id="depth" min="5" max="50" value="20" step="5" />
    <span id="depth-label" style="font-size:0.75rem;color:var(--gold);text-align:center">20</span>
  </div>

  <div class="control-group">
    <label>Visualization</label>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="spiral">Spiral</button>
      <button class="mode-tab" data-mode="tree">Tree</button>
      <button class="mode-tab" data-mode="mandala">Mandala</button>
      <button class="mode-tab" data-mode="scatter">Scatter</button>
      <button class="mode-tab" data-mode="julia">Julia</button>
      <button class="mode-tab" data-mode="graph">Graph</button>
      <button class="mode-tab" data-mode="matrix">Matrix M</button>
    </div>
  </div>

  <div class="btn-row">
    <button id="draw-btn">✦ Draw</button>
    <button id="play-btn">▶ Play</button>
  </div>

  <div id="mode-info"></div>
</div>

<div class="main">
  <div id="canvas-wrap">
    <canvas id="fractal" width="520" height="520"></canvas>
  </div>
  <div class="sidebar" id="sidebar">
    <div class="breakdown-title">Gematria Breakdown</div>
    <div id="breakdown"></div>
  </div>
</div>

<footer>Each letter a number · Each number a letter · The text folds into itself</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
